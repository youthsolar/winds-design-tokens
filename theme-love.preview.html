<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Noto Serif TC",serif;display:flex;min-height:520px}
.half{flex:1;padding:28px 26px;box-sizing:border-box}
h2{margin:0 0 4px;font-size:17px;font-weight:500}
.sub{font-size:11px;opacity:.65;font-family:"Noto Sans TC",sans-serif;margin-bottom:16px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.c{width:56px}
.c i{display:block;height:40px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}
.c b{display:block;font:400 9px/1.6 "Noto Sans TC",sans-serif;opacity:.7;text-align:center}
.demo{border-radius:14px;padding:16px 18px;margin-top:6px}
.demo .v{font-size:19px;font-weight:600;letter-spacing:.04em}
.demo .r{font-size:11.5px;margin-top:4px}
.btn{display:inline-block;margin-top:12px;padding:9px 20px;border-radius:999px;font-size:13px;font-weight:500}
</style></head><body>
<div class="half" style="background:#FBF4F6;color:#2E2823">
  <h2>粉瓷（亮）</h2><div class="sub">surface #FBF4F6 · card #FFFDFE · accent #C9798E</div>
  <div class="sw">
    <div class="c"><i style="background:#F9E7EC"></i><b>50</b></div>
    <div class="c"><i style="background:#F4D6DE"></i><b>100</b></div>
    <div class="c"><i style="background:#E9B9C6"></i><b>200</b></div>
    <div class="c"><i style="background:#DA8DA3"></i><b>300</b></div>
    <div class="c"><i style="background:#C9798E"></i><b>400</b></div>
    <div class="c"><i style="background:#B36378"></i><b>500</b></div>
    <div class="c"><i style="background:#9C4E63"></i><b>600</b></div>
  </div>
  <div class="demo" style="background:#FFFDFE;border:1px solid #F0DDE3;border-left:4px solid #C9798E">
    <div class="v">可續，話說前面。</div>
    <div class="r" style="color:#6E6359">你盤在收、他盤在躲，期限要妳自己訂。</div>
    <span class="btn" style="background:#C9798E;color:#FFFDFE">解鎖完整交代</span>
  </div>
</div>
<div class="half" style="background:#241A1F;color:#F2E7EB">
  <h2>玫瑰夜（暗）</h2><div class="sub" style="opacity:.55">surface #241A1F · card #342630 · accent #E39CB1</div>
  <div class="sw">
    <div class="c"><i style="background:#432935"></i><b style="color:#BCA6AF">50</b></div>
    <div class="c"><i style="background:#4E2F3C"></i><b style="color:#BCA6AF">100</b></div>
    <div class="c"><i style="background:#5C3F4C"></i><b style="color:#BCA6AF">200</b></div>
    <div class="c"><i style="background:#D1879C"></i><b style="color:#BCA6AF">300</b></div>
    <div class="c"><i style="background:#E39CB1"></i><b style="color:#BCA6AF">400</b></div>
    <div class="c"><i style="background:#ECB2C3"></i><b style="color:#BCA6AF">500</b></div>
    <div class="c"><i style="background:#F2C4D2"></i><b style="color:#BCA6AF">600</b></div>
  </div>
  <div class="demo" style="background:#342630;border:1px solid #3E2C35;border-left:4px solid #E39CB1">
    <div class="v">可續，話說前面。</div>
    <div class="r" style="color:#BCA6AF">你盤在收、他盤在躲，期限要妳自己訂。</div>
    <span class="btn" style="background:#E39CB1;color:#2E1B23">解鎖完整交代</span>
  </div>
</div>
</body></html>
